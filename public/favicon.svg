<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="contuberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBFF00"/>
      <stop offset="60%" stop-color="#95EC00"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBFF00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium Obsidian Base with Subtle Border -->
  <rect width="64" height="64" rx="16" fill="#09090B"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#contuberGrad)" stroke-width="1.8" stroke-opacity="0.65"/>

  <!-- Subtle Radial Background Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#glowGrad)" opacity="0.35"/>

  <!-- Stylized Geometric "C" for Contuber with Integrated Growth Arrow & Tech Aperture -->
  <!-- Main C Path -->
  <path d="M 44 18 C 39 13 25 13 19 20 C 13 27 13 37 19 44 C 25 51 39 51 44 46 L 40 40 C 36 44 26 44 22 39 C 18 34 18 30 22 25 C 26 20 36 20 40 24 Z" 
        fill="url(#contuberGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Center AI Node Sparkle (4-point Diamond Star) -->
  <path d="M 35 32 Q 41 32 41 26 Q 41 32 47 32 Q 41 32 41 38 Q 41 32 35 32 Z" 
        fill="#FFFFFF"/>
  <circle cx="41" cy="32" r="1.8" fill="#CBFF00"/>

  <!-- Mini Status / Partnership Beacon (Top-right high-status dot) -->
  <circle cx="50" cy="14" r="3.5" fill="#CBFF00"/>
  <circle cx="50" cy="14" r="5.5" fill="none" stroke="#CBFF00" stroke-width="1" opacity="0.6"/>
</svg>
